<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JaneConverter Bridge</title>
    <style>
      :root { color-scheme: dark; font-family: Segoe UI, Arial, sans-serif; }
      body { width: 300px; margin: 0; padding: 18px; background: #090712; color: #eee; }
      h1 { margin: 0; font-size: 16px; }
      p { color: #a1a1aa; font-size: 12px; line-height: 1.5; }
      button { width: 100%; border: 1px solid #ec4899; border-radius: 8px; padding: 10px 12px; background: #a21caf; color: white; font-weight: 600; cursor: pointer; }
      button:disabled { cursor: wait; opacity: .6; }
      #status { min-height: 34px; margin-top: 12px; color: #a7f3d0; font-size: 12px; line-height: 1.45; }
      .warning { color: #fcd34d !important; }
      .error { color: #fda4af !important; }
    </style>
  </head>
  <body>
    <h1>JaneConverter Browser Bridge</h1>
    <p>Connect only the current source session to JaneConverter. Nothing is uploaded or saved as a cookie file.</p>
    <button id="connect" type="button">Connect to JaneConverter</button>
    <div id="status" role="status" aria-live="polite">Confirm access in JaneConverter first.</div>
    <script src="popup.js"></script>
  </body>
</html>

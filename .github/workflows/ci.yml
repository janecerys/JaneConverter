name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with pyflakes
        run: python -m pyflakes engine/ run_converter.py gui.py update_helper.py

      - name: Run hermetic test suite
        run: python -m pytest tests/ -v

      - name: Run online tests (opt-in)
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch'
        run: python -m pytest tests/ -m online -v

  native:
    name: Native frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install native Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - name: Check shell launchers
        if: runner.os != 'Windows'
        run: bash -n install.sh run_converter.sh uninstall.sh
      - name: Check Rust formatting
        run: cargo fmt --manifest-path native_ui/Cargo.toml --check
      - name: Run Rust tests
        run: cargo test --manifest-path native_ui/Cargo.toml
      - name: Build Rust release frontend
        run: cargo build --release --manifest-path native_ui/Cargo.toml

name: Windows Release Package

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - name: Install Python dependencies for package smoke tests
        run: python -m pip install -r requirements-dev.txt
      - name: Build portable source package
        shell: pwsh
        run: .\build_release.ps1 -Version "${{ github.ref_name }}".TrimStart('v')
      - name: Ensure FFmpeg is available for the consumer bundle
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg.exe -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe.exe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress --yes
          }
      - name: Build consumer setup installer
        shell: pwsh
        run: .\packaging\build_consumer.ps1 -Version "${{ github.ref_name }}".TrimStart('v') -SkipPortable
      - name: Verify release package contents
        shell: pwsh
        run: |
          $archive = Get-ChildItem dist -Filter "*.zip" | Select-Object -First 1
          if (-not $archive) { throw "No release ZIP was produced." }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($archive.FullName)
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName -replace '\\', '/' })
            foreach ($required in @("JaneConverter.exe", "JaneConverterNative.exe", "README.md", "LICENSE", "update_helper.py", "assets/icon.ico", "engine/version.py")) {
              if ($required -notin $names) { throw "Release ZIP is missing $required" }
            }
            if ($names | Where-Object { $_ -match "(^|/)(__pycache__|\.pytest_cache|temp|converted)(/|$)|\.(pyc|pyo|log)$" }) {
              throw "Release ZIP contains generated cache or runtime data."
            }
          } finally {
            $zip.Dispose()
          }
      - name: Smoke-test packaged Python entry points
        shell: pwsh
        run: |
          $package = Get-ChildItem dist -Directory -Filter "JaneConverter-*" | Select-Object -First 1
          python -m py_compile "$package\run_converter.py" "$package\gui.py" "$package\update_helper.py"
          $version = python "$package\run_converter.py" --version
          if (-not $version -or $version -notmatch "JaneConverter") { throw "Packaged CLI version check failed." }
          $installer = Get-Item dist\JaneConverter-Setup.exe -ErrorAction Stop
          if ($installer.Length -lt 1MB) { throw "Consumer setup installer is unexpectedly small." }
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JaneConverter-${{ github.ref_name }}-windows
          path: |
            dist/*.zip
            dist/*.sha256
            dist/JaneConverter-Setup.exe
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
            dist/JaneConverter-Setup.exe
          generate_release_notes: true

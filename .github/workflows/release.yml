name: Release packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          architecture: x64
          cache: npm
          cache-dependency-path: desktop-ui/package-lock.json
      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install Python build dependencies
        run: uv sync --locked
      - name: Validate packaging contracts
        run: |
          uv pip check
          uv run --locked pytest -q tests/test_consumer_packaging.py
      - name: Download and verify static FFmpeg
        id: ffmpeg
        shell: pwsh
        run: |
          $name = "ffmpeg-master-latest-win64-gpl.zip"
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$name"
          Invoke-WebRequest -Uri $url -OutFile $name
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/checksums.sha256" -OutFile checksums.sha256
          $checksumLine = Get-Content checksums.sha256 | Where-Object { $_ -match [regex]::Escape($name) } | Select-Object -First 1
          $expected = ([regex]::Match($checksumLine, '[a-fA-F0-9]{64}')).Value.ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 $name).Hash.ToLowerInvariant()
          if (-not $expected -or $actual -ne $expected) { throw "FFmpeg SHA256 verification failed." }
          Expand-Archive -LiteralPath $name -DestinationPath ffmpeg-static
          $ffmpeg = (Get-ChildItem ffmpeg-static -Recurse -Filter ffmpeg.exe -File | Select-Object -First 1).FullName
          $ffprobe = (Get-ChildItem ffmpeg-static -Recurse -Filter ffprobe.exe -File | Select-Object -First 1).FullName
          if (-not $ffmpeg -or -not $ffprobe) { throw "Verified FFmpeg archive did not contain both tools." }
          "ffmpeg=$ffmpeg" >> $env:GITHUB_OUTPUT
          "ffprobe=$ffprobe" >> $env:GITHUB_OUTPUT
      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = & uv run --locked python -c "from janeconverter.version import __version__; print(__version__)"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag $env:GITHUB_REF_NAME does not match engine version $version." }
      - name: Build Windows installer and portable package
        shell: pwsh
        run: |
          ./packaging/build_consumer.ps1 `
            -FFmpegPath "${{ steps.ffmpeg.outputs.ffmpeg }}" `
            -FFprobePath "${{ steps.ffmpeg.outputs.ffprobe }}" `
            -NodePath (Get-Command node.exe).Source
      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-release
          if-no-files-found: error
          path: |
            dist/JaneConverter-*-windows-x64-setup.exe
            dist/JaneConverter-*-windows-x64-setup.exe.sha256
            dist/JaneConverter-*-windows-x64-portable.zip
            dist/JaneConverter-*-windows-x64-portable.zip.sha256

  linux-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop-ui/package-lock.json
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev patchelf wget xz-utils
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install Python build dependencies
        run: uv sync --locked
      - name: Validate packaging contracts
        run: |
          uv pip check
          uv run --locked pytest -q tests/test_consumer_packaging.py
      - name: Download and verify static FFmpeg
        id: ffmpeg
        run: |
          set -euo pipefail
          name=ffmpeg-master-latest-linux64-gpl.tar.xz
          url="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$name"
          curl --fail --location --retry 3 --output "$name" "$url"
          curl --fail --location --retry 3 --output checksums.sha256 \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/checksums.sha256
          expected="$(awk -v name="$name" '$2 == name || $2 == "*" name {print tolower($1); exit}' checksums.sha256)"
          actual="$(sha256sum "$name" | cut -d' ' -f1)"
          test -n "$expected" && test "$actual" = "$expected"
          mkdir ffmpeg-static
          tar -xJf "$name" -C ffmpeg-static
          ffmpeg="$(find "$PWD/ffmpeg-static" -type f -name ffmpeg -perm -111 -print -quit)"
          ffprobe="$(find "$PWD/ffmpeg-static" -type f -name ffprobe -perm -111 -print -quit)"
          test -n "$ffmpeg" && test -n "$ffprobe"
          echo "ffmpeg=$ffmpeg" >> "$GITHUB_OUTPUT"
          echo "ffprobe=$ffprobe" >> "$GITHUB_OUTPUT"
      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(uv run --locked python -c 'from janeconverter.version import __version__; print(__version__)')"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Build Linux portable package
        run: |
          bash packaging/build_linux.sh \
            --ffmpeg "${{ steps.ffmpeg.outputs.ffmpeg }}" \
            --ffprobe "${{ steps.ffmpeg.outputs.ffprobe }}" \
            --node "$(command -v node)"
      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-release
          if-no-files-found: error
          path: |
            dist/JaneConverter-*-linux-x86_64.tar.gz
            dist/JaneConverter-*-linux-x86_64.tar.gz.sha256

  macos:
    name: macos-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            python-architecture: arm64
            node-architecture: arm64
            ffmpeg-asset: ffmpeg-darwin-arm64
            ffmpeg-url: https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-arm64
            ffmpeg-sha256: a90e3db6a3fd35f6074b013f948b1aa45b31c6375489d39e572bea3f18336584
            ffprobe-asset: ffprobe-darwin-arm64
            ffprobe-url: https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffprobe-darwin-arm64
            ffprobe-sha256: bb2db6f5d8cef919da12fbf592119a987202a8c060a886f3cab091f9cab90b64
          - arch: x86_64
            runner: macos-15-intel
            python-architecture: x64
            node-architecture: x64
            ffmpeg-asset: ffmpeg-darwin-x64
            ffmpeg-url: https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-x64
            ffmpeg-sha256: ebdddc936f61e14049a2d4b549a412b8a40deeff6540e58a9f2a2da9e6b18894
            ffprobe-asset: ffprobe-darwin-x64
            ffprobe-url: https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffprobe-darwin-x64
            ffprobe-sha256: fa3add0ce901f7241abe0dfc0155d958fc834aca3f8ce61f87cc712ae669c1e0
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python-architecture }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          architecture: ${{ matrix.node-architecture }}
          cache: npm
          cache-dependency-path: desktop-ui/package-lock.json
      - name: Verify native runner architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install Python build dependencies
        run: uv sync --locked
      - name: Validate packaging contracts
        run: |
          uv pip check
          uv run --locked pytest -q tests/test_consumer_packaging.py
      - name: Download and verify FFmpeg tools
        id: ffmpeg
        run: |
          set -euo pipefail
          mkdir ffmpeg-static
          ffmpeg="ffmpeg-static/${{ matrix.ffmpeg-asset }}"
          ffprobe="ffmpeg-static/${{ matrix.ffprobe-asset }}"
          curl --fail --location --retry 3 \
            --output "$ffmpeg" \
            "${{ matrix.ffmpeg-url }}"
          curl --fail --location --retry 3 \
            --output "$ffprobe" \
            "${{ matrix.ffprobe-url }}"
          printf '%s  %s\n' '${{ matrix.ffmpeg-sha256 }}' "$ffmpeg" | shasum -a 256 -c -
          printf '%s  %s\n' '${{ matrix.ffprobe-sha256 }}' "$ffprobe" | shasum -a 256 -c -
          chmod 0755 "$ffmpeg" "$ffprobe"
          echo "ffmpeg=$PWD/$ffmpeg" >> "$GITHUB_OUTPUT"
          echo "ffprobe=$PWD/$ffprobe" >> "$GITHUB_OUTPUT"
      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(uv run --locked python -c 'from janeconverter.version import __version__; print(__version__)')"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Build macOS DMG
        run: |
          bash packaging/build_macos.sh \
            --ffmpeg "${{ steps.ffmpeg.outputs.ffmpeg }}" \
            --ffprobe "${{ steps.ffmpeg.outputs.ffprobe }}" \
            --node "$(command -v node)"
      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-release
          if-no-files-found: error
          path: |
            dist/JaneConverter-*-macos-${{ matrix.arch }}.dmg
            dist/JaneConverter-*-macos-${{ matrix.arch }}.dmg.sha256

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-x64, linux-x86_64, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" artifacts/*
          --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          --title "JaneConverter $GITHUB_REF_NAME"

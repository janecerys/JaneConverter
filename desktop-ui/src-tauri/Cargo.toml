[package]
name = "janeconverter-desktop"
version = "1.2.0"
description = "The modern JaneConverter desktop surface"
authors = ["project//aspyr"]
edition = "2021"

[lib]
name = "janeconverter_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
